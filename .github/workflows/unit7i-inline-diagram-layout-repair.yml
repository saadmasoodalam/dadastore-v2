name: Unit 7I Inline Diagram Layout Repair

on:
  push:
    branches: [main]
    paths:
      - "scripts/unit7i-inline-diagram-layout-fix.mjs"
      - ".github/workflows/unit7i-inline-diagram-layout-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply Unit 7I CSS repair
        run: node scripts/unit7i-inline-diagram-layout-fix.mjs

      - name: Run blog and security tests
        run: |
          node scripts/test-blog-directory.mjs
          node scripts/test-article-structure.mjs
          node scripts/test-article-link-encoding.mjs
          node scripts/test-related-articles.mjs
          node scripts/test-featured-rotation.mjs
          node scripts/test-library-growth-contracts.mjs
          node scripts/test-utf8-text-files.mjs
          node scripts/audit-public-repo-security.mjs

      - name: Verify protected scope
        shell: bash
        run: |
          test "$(git diff --name-only -- blog/data/article-plan.json | wc -l)" -eq 0
          test "$(git diff --name-only -- blog/assets/blog.css | wc -l)" -eq 1

      - name: Commit fix and remove temporary automation
        shell: bash
        run: |
          rm -f scripts/unit7i-inline-diagram-layout-fix.mjs
          rm -f .github/workflows/unit7i-inline-diagram-layout-repair.yml
          git config user.name "DaDaStore Automation"
          git config user.email "dadastore.co@gmail.com"
          git add -- blog/assets/blog.css
          git add -u -- scripts .github/workflows
          git commit -m "Fix in-article diagram layout"
          git push origin HEAD:main
