name: Unit 7J SEO Foundation

on:
  push:
    branches: [main]
    paths:
      - "scripts/unit7j-seo-foundation.mjs"
      - ".github/workflows/unit7j-seo-foundation.yml"

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply SEO foundation
        run: node scripts/unit7j-seo-foundation.mjs

      - name: Run blog and security tests
        run: |
          node scripts/test-blog-directory.mjs
          node scripts/test-article-structure.mjs
          node scripts/test-article-link-encoding.mjs
          node scripts/test-related-articles.mjs
          node scripts/test-featured-rotation.mjs
          node scripts/test-library-growth-contracts.mjs
          node scripts/test-utf8-text-files.mjs
          node scripts/audit-public-repo-security.mjs

      - name: Verify protected scope
        shell: bash
        run: |
          test "$(git diff --name-only -- blog/data/article-plan.json | wc -l)" -eq 0
          test "$(git diff --name-only -- blog/data/posts.json | wc -l)" -eq 0
          test "$(git diff --name-only -- blog/feed.xml | wc -l)" -eq 0
          test "$(git diff --name-only -- blog/sitemap.xml | wc -l)" -eq 0
          test -f robots.txt
          test -f sitemap.xml

      - name: Commit SEO foundation and remove temporary automation
        shell: bash
        run: |
          rm -f scripts/unit7j-seo-foundation.mjs
          rm -f .github/workflows/unit7j-seo-foundation.yml
          git config user.name "DaDaStore Automation"
          git config user.email "dadastore.co@gmail.com"
          git add -- index.html blog robots.txt sitemap.xml
          git add -u -- scripts .github/workflows
          git commit -m "Strengthen site SEO foundation"
          git push origin HEAD:main