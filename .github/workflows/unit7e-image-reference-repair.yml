name: Unit 7E Image Reference Repair

on:
  push:
    branches: [main]
    paths:
      - "scripts/unit7e-live-image-reference-fix.mjs"
      - ".github/workflows/unit7e-image-reference-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply exact Unit 7E reference repair
        run: node scripts/unit7e-live-image-reference-fix.mjs

      - name: Run blog and security tests
        run: |
          node scripts/test-blog-directory.mjs
          node scripts/test-article-structure.mjs
          node scripts/test-article-link-encoding.mjs
          node scripts/test-related-articles.mjs
          node scripts/test-featured-rotation.mjs
          node scripts/test-library-growth-contracts.mjs
          node scripts/test-utf8-text-files.mjs
          node scripts/audit-public-repo-security.mjs

      - name: Verify protected files and scope
        shell: bash
        run: |
          test "$(git diff --name-only -- blog/data/article-plan.json | wc -l)" -eq 0
          test "$(git diff --name-only | wc -l)" -eq 52

      - name: Commit repaired references and remove temporary automation
        shell: bash
        run: |
          rm -f scripts/unit7e-live-image-reference-fix.mjs
          rm -f .github/workflows/unit7e-image-reference-repair.yml
          git config user.name "DaDaStore Automation"
          git config user.email "dadastore.co@gmail.com"
          git add -- blog ':!blog/data/article-plan.json'
          git add -u -- scripts .github/workflows
          git commit -m "Fix premium cover image references"
          git push origin HEAD:main
