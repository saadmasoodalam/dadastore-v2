<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img"><title>Practical Marketing Decision Log review pipeline showing inputs, controls, decision, and recorded outcome.</title><rect width="1280" height="520" fill="#080b18"/><text x="60" y="65" fill="#eef5ff" font-family="Arial" font-size="26">A Practical Marketing Decision Log</text><g><rect x="55" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="80" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Risk: options evidence</text></g><g><rect x="460" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="485" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Exposure: evidence owner</text></g><g><rect x="865" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="890" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Controls: owner rationale</text></g><g><rect x="55" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="80" y="330" fill="#eef5ff" font-family="Arial" font-size="17">Ownership: rationale assumptions</text></g><g><rect x="460" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="485" y="330" fill="#eef5ff" font-family="Arial" font-size="17">QA: assumptions review</text></g><g><rect x="865" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="890" y="330" fill="#eef5ff" font-family="Arial" font-size="17">Escalation: review consequences</text></g></svg>