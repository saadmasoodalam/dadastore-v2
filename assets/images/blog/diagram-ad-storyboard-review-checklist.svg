<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img"><title>Ad Storyboard Review Checklist evidence ladder showing inputs, controls, decision, and recorded outcome.</title><rect width="1280" height="520" fill="#080b18"/><text x="60" y="65" fill="#eef5ff" font-family="Arial" font-size="26">An Ad Storyboard Review Checklist</text><g><rect x="55" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="80" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Symptoms: hook frame</text></g><g><rect x="460" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="485" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Root causes: sequence pacing</text></g><g><rect x="865" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="890" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Tests: frame demonstration</text></g><g><rect x="55" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="80" y="330" fill="#eef5ff" font-family="Arial" font-size="17">Fixes: pacing caption</text></g><g><rect x="460" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="485" y="330" fill="#eef5ff" font-family="Arial" font-size="17">Prevention: demonstration sound</text></g><g><rect x="865" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="890" y="330" fill="#eef5ff" font-family="Arial" font-size="17">Monitoring: caption action</text></g></svg>