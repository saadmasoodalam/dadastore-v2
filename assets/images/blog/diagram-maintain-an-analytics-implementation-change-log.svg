<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img"><title>Maintain an Analytics Implementation Change Log diagnostic tree showing inputs, controls, decision, and recorded outcome.</title><rect width="1280" height="520" fill="#080b18"/><text x="60" y="65" fill="#eef5ff" font-family="Arial" font-size="26">How to Maintain an Analytics Implementation Change Log</text><g><rect x="55" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="80" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Symptoms: release owner</text></g><g><rect x="460" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="485" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Root causes: version timestamp</text></g><g><rect x="865" y="110" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="890" y="160" fill="#eef5ff" font-family="Arial" font-size="17">Tests: schema rollback</text></g><g><rect x="55" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="80" y="330" fill="#eef5ff" font-family="Arial" font-size="17">Fixes: owner validation</text></g><g><rect x="460" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#12d9ff"/><text x="485" y="330" fill="#eef5ff" font-family="Arial" font-size="17">Prevention: timestamp annotations</text></g><g><rect x="865" y="280" width="365" height="120" rx="20" fill="#121a32" stroke="#ff3db8"/><text x="890" y="330" fill="#eef5ff" font-family="Arial" font-size="17">Monitoring: rollback provenance</text></g></svg>