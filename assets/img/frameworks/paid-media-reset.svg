      <rect width="127" height="60" rx="13" fill="#11172f" stroke="#00cfff" stroke-opacity=".55"/>
      <circle cx="29" cy="30" r="12" fill="#00cfff" opacity=".2"/><circle cx="29" cy="27" r="4" fill="#77e9ff"/><path d="M20 39c3-7 15-7 18 0" stroke="#77e9ff" fill="none"/>
