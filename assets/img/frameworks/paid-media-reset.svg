    <path d="M53 129h68" stroke="#8f4dff" stroke-width="9" stroke-linecap="round"/>
    <path d="M53 150h84" stroke="#ff28a9" stroke-width="9" stroke-linecap="round"/>
    <path d="M172 120h70M242 120V78M242 120v42" fill="none" stroke="url(#flow)" stroke-width="3"/>
    <g transform="translate(242 48)">
      <rect width="127" height="60" rx="13" fill="#15152f" stroke="#8f4dff" stroke-opacity=".6"/>
      <circle cx="29" cy="30" r="12" fill="#8f4dff" opacity=".3"/><circle cx="29" cy="27" r="4" fill="#c6b4ff"/><path d="M20 39c3-7 15-7 18 0" stroke="#c6b4ff" fill="none"/>
      <text x="52" y="27">Audience</text><text x="52" y="43" fill="#8f98b2">Layer 01</text>
