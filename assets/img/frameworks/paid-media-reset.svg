<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">Paid media reset</title>
  <desc id="desc">Abstract campaign structure with audience groups, allocation bars, and optimization paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c20"/><stop offset="1" stop-color="#15102e"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#226cff"/><stop offset=".5" stop-color="#8f4dff"/><stop offset="1" stop-color="#ff28a9"/></linearGradient>
  </defs>
  <rect width="600" height="240" rx="18" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#e2eaff">
    <text x="31" y="34" fill="#7ee7ff" letter-spacing="2">CAMPAIGN RESET</text>
    <rect x="30" y="55" width="142" height="130" rx="14" fill="#10162f" stroke="#226cff" stroke-opacity=".55"/>
    <text x="49" y="82">Campaign</text>
