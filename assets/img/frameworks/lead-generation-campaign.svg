<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">Lead generation campaign</title>
  <desc id="desc">Abstract audience funnel connecting message, qualification, and routing nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d22"/><stop offset="1" stop-color="#18102b"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00cfff"/><stop offset=".5" stop-color="#8f4dff"/><stop offset="1" stop-color="#ff28a9"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="240" rx="18" fill="url(#bg)"/>
  <circle cx="475" cy="22" r="150" fill="#8f4dff" opacity=".06"/>
