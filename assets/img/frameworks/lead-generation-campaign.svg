    <rect x="494" y="84" width="76" height="72" rx="14" fill="#17132e" stroke="#ff28a9" stroke-opacity=".7"/>
    <path d="M514 105h36M514 120h36M514 135h25" stroke="#ff73c6" stroke-linecap="round"/>
    <text x="507" y="176">Campaign</text>
