      <circle cx="65" cy="82" r="22"/><circle cx="125" cy="82" r="22"/><circle cx="95" cy="137" r="22"/>
    </g>
    <g fill="#00cfff"><circle cx="65" cy="77" r="6"/><circle cx="125" cy="77" r="6"/><circle cx="95" cy="132" r="6"/></g>
    <g stroke="#00cfff" stroke-width="2" stroke-linecap="round"><path d="M54 94c4-8 18-8 22 0M114 94c4-8 18-8 22 0M84 149c4-8 18-8 22 0"/></g>
    <path d="M168 62h70l45 58-45 58h-70l48-58z" fill="#111630" stroke="url(#flow)" stroke-width="2"/>
    <text x="179" y="116">Funnel</text><text x="179" y="136" fill="#8f9aba">Message</text>
    <path d="M283 120h54" stroke="#8f4dff" stroke-width="3" filter="url(#glow)"/>
    <rect x="337" y="69" width="112" height="102" rx="14" fill="#15152f" stroke="#8f4dff" stroke-opacity=".7"/>
