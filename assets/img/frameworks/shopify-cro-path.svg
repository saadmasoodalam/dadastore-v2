      <path d="M24 29h45M24 43h45M24 57h30" stroke="#72fff6" stroke-width="2" stroke-linecap="round"/>
      <circle cx="72" cy="67" r="8" fill="none" stroke="#00fff0" stroke-width="2"/>
      <path d="M68 67l3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="21" y="78">Checkout</text>
    </g>
    <g fill="#fff" stroke-width="4"><circle cx="92" cy="171" r="6" stroke="#00cfff"/><circle cx="241" cy="127" r="6" stroke="#8f4dff"/><circle cx="388" cy="119" r="6" stroke="#ff28a9"/><circle cx="522" cy="84" r="6" stroke="#00fff0"/></g>
