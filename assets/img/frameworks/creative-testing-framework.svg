<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">Creative testing framework</title>
  <desc id="desc">Abstract creative matrix comparing hooks, angles, offers, and test paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b20"/><stop offset="1" stop-color="#14102c"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff28a9"/><stop offset="1" stop-color="#8f4dff"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00cfff"/><stop offset="1" stop-color="#226cff"/></linearGradient>
  </defs>
  <rect width="600" height="240" rx="18" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif" fill="#e4eaff">
    <text x="34" y="35" font-size="12" fill="#ff73c6" letter-spacing="2">CREATIVE MATRIX</text>
    <g transform="translate(34 53)">
      <rect width="150" height="152" rx="15" fill="#17132e" stroke="#ff28a9" stroke-opacity=".62"/>
      <rect x="14" y="14" width="122" height="76" rx="10" fill="url(#a)" opacity=".28"/>
      <circle cx="75" cy="52" r="21" fill="none" stroke="#ff79c9" stroke-width="2"/>
      <path d="M65 52l8 8 16-18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="15" y="113" font-size="13">Test A</text>
      <path d="M15 130h93M15 141h68" stroke="#ff79c9" stroke-opacity=".65" stroke-linecap="round"/>
    </g>
    <g transform="translate(207 53)">
      <rect width="150" height="152" rx="15" fill="#10172f" stroke="#00cfff" stroke-opacity=".62"/>
      <rect x="14" y="14" width="122" height="76" rx="10" fill="url(#b)" opacity=".28"/>
      <path d="M46 65l24-28 17 18 20-14v32H46z" fill="none" stroke="#70e7ff" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="15" y="113" font-size="13">Test B</text>
      <path d="M15 130h75M15 141h105" stroke="#70e7ff" stroke-opacity=".65" stroke-linecap="round"/>
    </g>
    <g transform="translate(390 53)" font-size="12">
      <rect width="176" height="152" rx="15" fill="#12152d" stroke="#8f4dff" stroke-opacity=".55"/>
      <text x="18" y="29" fill="#bda8ff">Hook</text><rect x="75" y="17" width="78" height="15" rx="7.5" fill="#ff28a9" opacity=".36"/>
      <text x="18" y="62" fill="#bda8ff">Angle</text><rect x="75" y="50" width="55" height="15" rx="7.5" fill="#8f4dff" opacity=".48"/>
      <text x="18" y="95" fill="#bda8ff">Offer</text><rect x="75" y="83" width="90" height="15" rx="7.5" fill="#00cfff" opacity=".38"/>
      <text x="18" y="128" fill="#bda8ff">Creative</text><rect x="75" y="116" width="68" height="15" rx="7.5" fill="#226cff" opacity=".48"/>
    </g>
    <path d="M184 129h23M357 129h33" stroke="#8f4dff" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
</svg>
